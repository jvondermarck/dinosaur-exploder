load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    js_import capacity from /etc/nginx/capacity.js;
    limit_req_zone $binary_remote_addr zone=capacity_checks:1m rate=2r/s;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream game_pool {
        zone game_pool 64k;
        server pool:8080 resolve;
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        # Reject ambiguous paths before a downstream server can decode them again.
        if ($uri ~ "[%;\\\\]") { return 400; }
        location = / {
            add_header Cache-Control no-store always;
            try_files /index.html =404;
        }
        location = /index.html {
            add_header Cache-Control no-store always;
        }
        location = /busy.html {
            add_header Cache-Control no-store always;
        }
        location = /unavailable.html {
            add_header Cache-Control no-store always;
        }
        location = /pool-ui.js {
            add_header Cache-Control no-store always;
        }
        location = /pool-ui.css {
            add_header Cache-Control no-store always;
        }
        location = /_pool/availability {
            limit_except GET { deny all; }
            limit_req zone=capacity_checks burst=5 nodelay;
            limit_req_status 429;
            js_content capacity.availability;
        }
        location = /_internal/pool-status {
            internal;
            proxy_pass http://game_pool/loadbalancer/status;
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Host pool;
            proxy_set_header Content-Length "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
            subrequest_output_buffer_size 64k;
        }
        location ~* "(^|/)(loadbalancer|jpro/api)(/|$)" {
            return 404;
        }
        location /_internal/ { return 404; }
        location /_pool/ { return 404; }
        location / {
            proxy_pass http://game_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 1h;
            proxy_buffering off;
        }
    }
}
